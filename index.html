<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>易闻查词 · 小红书违禁词工作台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --red: #FF2442; --bg: #FFF9F8; --ink: #1F1A1B;
  }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  ::selection { background: #FFD3DA; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #E3D7D9; border-radius: 9px; border: 2px solid #FFF9F8; }
  ::-webkit-scrollbar-thumb:hover { background: #D2C2C5; }
  textarea, input { font-family: inherit; }
  button { font-family: inherit; }
  @keyframes fadeUp { from { transform: translateY(8px); } to { transform: none; } }
  .fadein { animation: fadeUp .32s cubic-bezier(.2,.7,.3,1); }
  @media (prefers-reduced-motion: reduce) { .fadein { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/app/main.jsx"></script>
</body>
</html>
